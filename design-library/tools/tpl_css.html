<title>Standard Design Selector</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: drafting-office tool. Filter rail left, detail "sheets" centre, each card carries a title-block strip like a drawing. */
:root{
  --paper:#f3f5f7; --sheet:#ffffff; --ink:#18232f; --ink-2:#4b5a69; --rule:#d5dce3; --rule-2:#e7ecf0;
  --accent:#1d5a8c; --accent-soft:#e3edf6; --concrete:#c9d1d8; --soil:#d9c9a8; --hatch:#8a97a3;
  --ok:#2f7a4a; --ok-soft:#dff0e5; --warn:#a35a00; --warn-soft:#fbecd6; --bad:#b03a2e; --bad-soft:#f8dedb;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --body:"Barlow",Arial,sans-serif; --mono:"IBM Plex Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#111820; --sheet:#18212b; --ink:#e3e9ef; --ink-2:#9fadbb; --rule:#2c3946; --rule-2:#22303c;
  --accent:#6fa8dc; --accent-soft:#1f3347; --concrete:#55626f; --soil:#6b5d43; --hatch:#7d8a97;
  --ok:#6cc48d; --ok-soft:#1d3527; --warn:#e6a352; --warn-soft:#3a2c17; --bad:#ec8a7f; --bad-soft:#3e211e; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111820; --sheet:#18212b; --ink:#e3e9ef; --ink-2:#9fadbb; --rule:#2c3946; --rule-2:#22303c;
  --accent:#6fa8dc; --accent-soft:#1f3347; --concrete:#55626f; --soil:#6b5d43; --hatch:#7d8a97;
  --ok:#6cc48d; --ok-soft:#1d3527; --warn:#e6a352; --warn-soft:#3a2c17; --bad:#ec8a7f; --bad-soft:#3e211e; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:1280px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;border-bottom:2px solid var(--ink);padding-bottom:12px}
h1{font-family:var(--display);font-weight:700;font-size:2rem;letter-spacing:.01em;margin:0;line-height:1;text-wrap:balance}
.sub{color:var(--ink-2);font-size:.9rem;margin-top:4px}
.proto{font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;border:1px dashed var(--warn);color:var(--warn);padding:4px 8px;border-radius:3px}
nav.tabs{display:flex;gap:4px;margin:16px 0 18px;flex-wrap:wrap}
nav.tabs button{font-family:var(--display);font-weight:600;font-size:1.05rem;letter-spacing:.03em;text-transform:uppercase;background:none;border:1px solid var(--rule);color:var(--ink-2);padding:7px 16px;border-radius:3px;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.count{display:inline-block;min-width:1.4em;text-align:center;background:var(--accent);color:#fff;border-radius:10px;font-family:var(--mono);font-size:.75rem;padding:0 6px;margin-left:6px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.layout{grid-template-columns:minmax(0,1fr)}}
.rail{background:var(--sheet);border:1px solid var(--rule);border-radius:4px;padding:16px;display:flex;flex-direction:column;gap:14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
@media (max-width:820px){.rail{position:static}}
.lbl{font-family:var(--display);font-weight:600;font-size:.82rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);display:block;margin-bottom:4px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--rule);border-radius:3px;overflow:hidden}
.seg button{background:var(--sheet);border:0;border-right:1px solid var(--rule);padding:8px 4px;font-family:var(--body);font-weight:600;font-size:.85rem;color:var(--ink-2);cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
select,input[type=number],input[type=text]{width:100%;font:inherit;font-size:.95rem;padding:7px 9px;border:1px solid var(--rule);border-radius:3px;background:var(--paper);color:var(--ink)}
input[type=number]{font-family:var(--mono)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:.8rem;color:var(--ink-2)}
.yn{display:flex;gap:6px}.yn button{flex:1;padding:7px;border:1px solid var(--rule);background:var(--paper);color:var(--ink-2);border-radius:3px;font-weight:600;cursor:pointer}
.yn button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}

.verdict{display:flex;gap:12px;align-items:center;padding:10px 14px;border-radius:4px;margin-bottom:14px;font-weight:600}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}.verdict.warn{background:var(--warn-soft);color:var(--warn)}.verdict.bad{background:var(--bad-soft);color:var(--bad)}
.verdict small{font-weight:400;color:var(--ink-2);display:block}
.results{display:grid;gap:16px}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:4px;display:grid;grid-template-columns:200px minmax(0,1fr);overflow:hidden}
.sheet.best{border:2px solid var(--accent)}
@media (max-width:600px){.sheet{grid-template-columns:minmax(0,1fr)}}
.draw{background:var(--paper);border-right:1px solid var(--rule);padding:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
@media (max-width:600px){.draw{border-right:0;border-bottom:1px solid var(--rule)}}
.draw svg{width:100%;max-width:180px;height:130px}
.draw .cap{font-family:var(--mono);font-size:.72rem;color:var(--ink-2);text-align:center}
.info{padding:14px 16px 0;display:flex;flex-direction:column;gap:10px;min-width:0}
.idline{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.id{font-family:var(--mono);font-weight:500;font-size:1rem;word-break:break-all}
.pill{font-family:var(--display);font-weight:600;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:10px}
.pill.Approved{background:var(--ok-soft);color:var(--ok)}.pill.Checked,.pill.WIP{background:var(--warn-soft);color:var(--warn)}.pill.Superseded{background:var(--bad-soft);color:var(--bad)}
.pill.tag{background:var(--accent-soft);color:var(--accent)}
.desc{font-size:1rem;font-weight:500}
.specs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px 14px;margin:0}
.specs div{min-width:0}.specs dt{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.specs dd{margin:0;font-family:var(--mono);font-size:.85rem;overflow-wrap:anywhere}
.lim{font-size:.82rem;color:var(--ink-2)}
.tb{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--ink);margin:4px -16px 0}
.tb>div{padding:8px 12px;border-right:1px solid var(--rule);display:flex;flex-direction:column;gap:2px;min-width:0}
.tb>div:last-child{border-right:0}
.tb .k{font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.file{display:flex;gap:6px;align-items:center;min-width:0}
.file code{font-family:var(--mono);font-size:.74rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.mini{border:1px solid var(--rule);background:var(--paper);color:var(--accent);font-size:.72rem;font-weight:600;padding:2px 6px;border-radius:3px;cursor:pointer;flex:none}
.add{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.add input{width:120px}
.btn{background:var(--accent);color:#fff;border:0;border-radius:3px;padding:8px 14px;font:inherit;font-weight:600;font-size:.9rem;cursor:pointer}
.btn.ghost{background:none;color:var(--accent);border:1px solid var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.others-h{font-family:var(--display);font-weight:600;font-size:1rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin:10px 0 0;border-bottom:1px solid var(--rule);padding-bottom:4px}

.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:4px;padding:16px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{border-bottom:1px solid var(--rule-2);padding:7px 8px;text-align:left;vertical-align:middle}
th{font-family:var(--display);font-weight:600;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);border-bottom:1.5px solid var(--ink);white-space:nowrap}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td code{font-family:var(--mono);font-size:.8rem;white-space:nowrap}
tfoot td{font-weight:700;border-top:1.5px solid var(--ink);border-bottom:0}
td input{min-width:80px}
.tp-head{display:flex;flex-wrap:wrap;gap:12px;align-items:end;justify-content:space-between;margin-bottom:12px}
.tp-head .grow{flex:1 1 280px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.x{background:none;border:0;color:var(--bad);cursor:pointer;font-size:1.1rem}
.flag{font-size:.78rem;font-weight:600}.flag.ok{color:var(--ok)}.flag.warn{color:var(--warn)}
.empty{padding:28px;text-align:center;color:var(--ink-2)}
.note{font-size:.8rem;color:var(--ink-2);margin-top:10px}

.cov{display:grid;gap:20px}
.heat td.c{text-align:center;font-family:var(--mono);font-weight:500;min-width:48px}
.heat td.z{background:var(--bad-soft);color:var(--bad)}.heat td.p{background:var(--ok-soft);color:var(--ok)}
h2{font-family:var(--display);font-weight:700;font-size:1.3rem;margin:0 0 8px;text-wrap:balance}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--sheet);padding:8px 16px;border-radius:4px;font-weight:600;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
.hidden-copy{position:absolute;left:-9999px}
.seg button{border-bottom:1px solid var(--rule)}
.seg button:nth-child(4n){border-right:0}
.fields{display:flex;flex-direction:column;gap:14px}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.chk{font-size:.78rem;font-weight:600;padding:2px 8px;border-radius:3px}
.chk.OK{background:var(--ok-soft);color:var(--ok)}.chk.NOTE{background:var(--warn-soft);color:var(--warn)}.chk.FAIL{background:var(--bad-soft);color:var(--bad)}
.chk.BCA{background:var(--accent-soft);color:var(--accent)}
.files{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));border-top:1px solid var(--ink);margin:4px -16px 0}
.files>div{padding:8px 12px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule-2);display:flex;flex-direction:column;gap:2px;min-width:0}
.files .k{font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.na{color:var(--ink-2);font-size:.74rem;font-family:var(--mono)}
td input.sheet{width:56px;min-width:56px}
</style>
